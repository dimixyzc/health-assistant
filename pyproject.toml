[project]
name = "personal-health-assistant"
version = "1.2.0"
description = "Health coaching, read-only training context and local Codex planning"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
training-plan = "training_plan.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["training_plan*", "analytics*", "ai*", "bot*", "connectors*", "knowledge*", "storage*"]

[tool.setuptools]
py-modules = ["config", "health_report", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
